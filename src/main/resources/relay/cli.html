<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KoLmafia gCLI</title>
<style>
	:root {
		--bg: #ffffff;
		--fg: #111111;
		--border: #cccccc;
		--input-bg: #ffffff;
		--accent: #2a6ebb;
		color-scheme: light dark;
	}

	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #1b1b1f;
			--fg: #e4e4e7;
			--border: #3a3a42;
			--input-bg: #26262c;
			--accent: #7aa7e0;
		}
	}

	body {
		margin: 0;
		background: var(--bg);
		color: var(--fg);
		font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
		display: flex;
		flex-direction: column;
		height: 100vh;
		height: 100dvh;
		touch-action: manipulation;
	}

	header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 8px;
		padding: 6px 10px;
		border-bottom: 1px solid var(--border);
		font-family: Arial, Helvetica, sans-serif;
		font-size: 0.8rem;
	}

	header b {
		font-weight: 600;
	}

	header a {
		color: var(--fg);
	}

	#log {
		flex: 1;
		min-height: 0;
		overflow-y: auto;
		padding: 6px 10px;
		overflow-wrap: anywhere;
	}

	form {
		display: flex;
		gap: 6px;
		padding: 6px 10px;
		border-top: 1px solid var(--border);
		background: var(--bg);
	}

	input[type="text"],
	select {
		flex: 1;
		min-width: 0;
		padding: 10px 8px;
		font-family: Arial, Helvetica, sans-serif;
		font-size: 16px;
		color: var(--fg);
		background: var(--input-bg);
		border: 1px solid var(--border);
		border-radius: 4px;
	}

	input[type="text"]:focus {
		outline: 2px solid var(--accent);
		outline-offset: -1px;
	}

	button {
		padding: 10px 14px;
		font: bold 10pt Arial, Helvetica, sans-serif;
		color: var(--fg);
		background: var(--input-bg);
		border: 1px solid var(--border);
		border-radius: 4px;
		cursor: pointer;
	}

	button:hover {
		border-color: var(--accent);
	}

	#abort {
		display: none;
	}

	form[hidden] {
		display: none;
	}

	#promptform {
		flex-wrap: wrap;
		align-items: center;
		justify-content: flex-end;
		border-top: 2px solid var(--accent);
		background: color-mix(in srgb, var(--accent) 12%, var(--bg));
	}

	#promptform p {
		flex: 1 0 100%;
		margin: 0;
		white-space: pre-wrap;
		font-family: Arial, Helvetica, sans-serif;
	}

	#promptform p::before {
		content: "Script is waiting for an answer";
		display: block;
		margin-bottom: 2px;
		font-size: 0.75rem;
		font-weight: 600;
		text-transform: uppercase;
		letter-spacing: 0.04em;
		color: var(--accent);
	}

	#promptform button[value="OK"],
	#promptform button[value="Yes"] {
		color: var(--bg);
		background: var(--accent);
		border-color: var(--accent);
	}

	@media (pointer: coarse) {
		#abort {
			display: inline-block;
		}
	}
</style>
</head>
<body>

<header>
	<b>KoLmafia gCLI</b>
	<a href="/chatlaunch.php">Announcements</a>
</header>

<div id="log" role="log" aria-live="polite"></div>

<form id="cmdform" autocomplete="off">
	<input type="text" id="cmd" name="cmd" maxlength="200" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="KoLmafia command">
	<button type="button" id="abort">abort</button>
	<button type="submit">exec</button>
</form>

<form id="promptform" autocomplete="off" hidden></form>

<script>
	var MAX_LOG_NODES = 2000;
	var HISTORY_KEY = "gcli.history";
	var HISTORY_LIMIT = 200;
	var LONG_POLL_TIMEOUT_MS = 25000;

	var log = document.getElementById( "log" );
	var form = document.getElementById( "cmdform" );
	var input = document.getElementById( "cmd" );

	var since = null;
	var refresh = 0;
	var failures = 0;
	var promptId = 0;
	var promptForm = document.getElementById( "promptform" );

	var commandHistory = loadHistory();
	var historyIndex = commandHistory.length;
	var draft = "";

	function loadHistory()
	{
		try
		{
			var saved = JSON.parse( sessionStorage.getItem( HISTORY_KEY ) );
			return Array.isArray( saved ) ? saved : [];
		}
		catch ( e )
		{
			return [];
		}
	}

	function saveHistory()
	{
		try
		{
			sessionStorage.setItem( HISTORY_KEY, JSON.stringify( commandHistory ) );
		}
		catch ( e )
		{
		}
	}

	function isNearBottom()
	{
		return log.scrollHeight - log.scrollTop - log.clientHeight < 40;
	}

	function appendLines( html )
	{
		var atBottom = isNearBottom();
		log.insertAdjacentHTML( "beforeend", html );

		while ( log.childNodes.length > MAX_LOG_NODES )
			log.removeChild( log.firstChild );

		if ( atBottom )
			log.scrollTop = log.scrollHeight;
	}

	function appendError( text )
	{
		var escaped = document.createElement( "span" );
		escaped.textContent = text;
		appendLines( "<div style=\"color:red\">" + escaped.innerHTML + "</div>" );
	}

	function clearLog()
	{
		log.innerHTML = "";
	}

	function sleep( ms )
	{
		return new Promise( function( resolve ) { setTimeout( resolve, ms ); } );
	}

	async function pollLoop()
	{
		while ( true )
		{
			var url = since === null
				? "/KoLmafia/messageUpdate?MAFIAHIT"
				: "/KoLmafia/messageUpdate?since=" + since + "&refresh=" + refresh + "&prompt=" + promptId + "&MAFIAHIT";

			try
			{
				var controller = new AbortController();
				var timer = setTimeout( function() { controller.abort(); }, LONG_POLL_TIMEOUT_MS + 5000 );
				var response = await fetch( url, { cache: "no-store", signal: controller.signal } );
				clearTimeout( timer );

				if ( !response.ok )
					throw new Error( "HTTP " + response.status );

				var data = await response.json();
				var reloadSidebar = since !== null && data.refresh !== refresh;
				since = data.head;
				refresh = data.refresh;
				if ( data.skipped > 0 )
					appendError( data.skipped + " lines skipped (too much output between updates)" );
				appendLines( data.events.join( "" ) );
				showPrompt( data.prompt );
				if ( reloadSidebar && window.top && window.top.charpane )
					window.top.charpane.location.reload();
				failures = 0;
			}
			catch ( e )
			{
				failures++;
				await sleep( Math.min( 1000 * Math.pow( 2, failures ), 15000 ) );
			}
		}
	}

	function hidePrompt()
	{
		promptForm.hidden = true;
		form.hidden = false;
		input.focus();
	}

	function showPrompt( prompt )
	{
		var id = prompt ? prompt.id : 0;
		if ( id == promptId )
			return;

		promptId = id;
		promptForm.replaceChildren();
		if ( !prompt )
		{
			hidePrompt();
			return;
		}
		promptForm.hidden = false;
		form.hidden = true;

		var text = document.createElement( "p" );
		text.textContent = prompt.message;
		promptForm.appendChild( text );

		var field = null;
		var options = null;
		var searchable = prompt.kind == "select" && prompt.options.length > 12;
		if ( prompt.kind == "text" || searchable )
		{
			field = document.createElement( "input" );
			field.type = "text";
			field.value = prompt.initial || "";
		}
		if ( searchable )
		{
			options = document.createElement( "datalist" );
			options.id = "promptoptions";
			field.setAttribute( "list", options.id );
			field.addEventListener( "input", function() { field.setCustomValidity( "" ); } );
			promptForm.appendChild( options );
		}
		else if ( prompt.kind == "select" || prompt.kind == "multiple" )
		{
			field = options = document.createElement( "select" );
			field.multiple = prompt.kind == "multiple";
		}
		if ( options )
			prompt.options.forEach( function( option ) { options.appendChild( new Option( option ) ); } );
		if ( field )
			promptForm.appendChild( field );

		var buttons = prompt.kind == "confirm" ? [ "Yes", "No" ] : prompt.kind == "alert" ? [ "OK" ] : [ "OK", "Cancel" ];
		buttons.forEach( function( label )
		{
			var button = document.createElement( "button" );
			button.value = label;
			button.textContent = label;
			promptForm.appendChild( button );
		} );

		function answer( label )
		{
			hidePrompt();

			var command = "promptanswer " + prompt.id;
			if ( prompt.kind == "confirm" )
				command += " " + ( label == "Yes" );
			else if ( label == "OK" && prompt.kind == "multiple" )
				command += " " + Array.from( field.selectedOptions, function( option ) { return option.index; } ).join( "," );
			else if ( label == "OK" && field )
				command += " " + field.value;
			submitCommand( command );
		}

		promptForm.onsubmit = function( event )
		{
			event.preventDefault();
			var label = event.submitter ? event.submitter.value : buttons[ 0 ];
			if ( label == "OK" && prompt.kind == "select" && prompt.options.indexOf( field.value ) < 0 )
			{
				field.setCustomValidity( "Pick one of the options" );
				field.reportValidity();
				return;
			}
			answer( label );
		};
		promptForm.onkeydown = function( event )
		{
			if ( event.key == "Escape" )
			{
				event.preventDefault();
				answer( buttons[ 1 ] );
			}
		};

		( field || promptForm.querySelector( "button" ) ).focus();
	}

	async function submitCommand( command )
	{
		if ( command == "clear" || command == "cls" || command == "reset" )
		{
			clearLog();
			return;
		}

		try
		{
			var response = await fetch( "/KoLmafia/submitCommand?cmd=" + encodeURIComponent( command ) + "&MAFIAHIT",
				{ cache: "no-store" } );
			if ( !response.ok )
				throw new Error( "HTTP " + response.status );
		}
		catch ( e )
		{
			appendError( "Could not send \"" + command + "\": " + e.message );
		}
	}

	form.addEventListener( "submit", function( event )
	{
		event.preventDefault();

		var command = input.value.trim();
		input.value = "";
		draft = "";

		if ( command == "" )
			return;

		if ( commandHistory[ commandHistory.length - 1 ] != command )
		{
			commandHistory.push( command );
			if ( commandHistory.length > HISTORY_LIMIT )
				commandHistory.shift();
			saveHistory();
		}
		historyIndex = commandHistory.length;

		submitCommand( command );
		input.focus();
	} );

	input.addEventListener( "keydown", function( event )
	{
		if ( event.key == "ArrowUp" && historyIndex > 0 )
		{
			event.preventDefault();
			if ( historyIndex == commandHistory.length )
				draft = input.value;
			historyIndex--;
			input.value = commandHistory[ historyIndex ];
		}
		else if ( event.key == "ArrowDown" && historyIndex < commandHistory.length )
		{
			event.preventDefault();
			historyIndex++;
			input.value = historyIndex == commandHistory.length ? draft : commandHistory[ historyIndex ];
		}
		else if ( event.key == "l" && ( event.ctrlKey || event.metaKey ) )
		{
			event.preventDefault();
			clearLog();
		}
		else if ( event.key == "Escape" )
		{
			event.preventDefault();
			submitCommand( "abort" );
		}
	} );

	document.getElementById( "abort" ).addEventListener( "click", function()
	{
		submitCommand( "abort" );
	} );

	input.focus();
	pollLoop();
</script>

</body>
</html>
