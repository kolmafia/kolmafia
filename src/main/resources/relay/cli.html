<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KoLmafia gCLI</title>
<style>
	:root {
		--bg: #ffffff;
		--fg: #111111;
		--border: #cccccc;
		--input-bg: #ffffff;
		--accent: #2a6ebb;
		color-scheme: light dark;
	}

	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #1b1b1f;
			--fg: #e4e4e7;
			--border: #3a3a42;
			--input-bg: #26262c;
			--accent: #7aa7e0;
		}
	}

	body {
		margin: 0;
		background: var(--bg);
		color: var(--fg);
		font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
		display: flex;
		flex-direction: column;
		height: 100vh;
		height: 100dvh;
		touch-action: manipulation;
	}

	header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 8px;
		padding: 6px 10px;
		border-bottom: 1px solid var(--border);
		font-family: Arial, Helvetica, sans-serif;
		font-size: 0.8rem;
	}

	header b {
		font-weight: 600;
	}

	header a {
		color: var(--fg);
	}

	#log {
		flex: 1;
		min-height: 0;
		overflow-y: auto;
		padding: 6px 10px;
		overflow-wrap: anywhere;
	}

	form {
		display: flex;
		gap: 6px;
		padding: 6px 10px;
		border-top: 1px solid var(--border);
		background: var(--bg);
	}

	input[type="text"] {
		flex: 1;
		min-width: 0;
		padding: 10px 8px;
		font-family: Arial, Helvetica, sans-serif;
		font-size: 16px;
		color: var(--fg);
		background: var(--input-bg);
		border: 1px solid var(--border);
		border-radius: 4px;
	}

	input[type="text"]:focus {
		outline: 2px solid var(--accent);
		outline-offset: -1px;
	}

	button {
		padding: 10px 14px;
		font: bold 10pt Arial, Helvetica, sans-serif;
		color: var(--fg);
		background: var(--input-bg);
		border: 1px solid var(--border);
		border-radius: 4px;
		cursor: pointer;
	}

	button:hover {
		border-color: var(--accent);
	}

	#abort {
		display: none;
	}

	@media (pointer: coarse) {
		#abort {
			display: inline-block;
		}
	}
</style>
</head>
<body>

<header>
	<b>KoLmafia gCLI</b>
	<a href="/chatlaunch.php">Announcements</a>
</header>

<div id="log" role="log" aria-live="polite"></div>

<form id="cmdform" autocomplete="off">
	<input type="text" id="cmd" name="cmd" maxlength="200" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="KoLmafia command">
	<button type="button" id="abort">abort</button>
	<button type="submit">exec</button>
</form>

<script>
	var MAX_LOG_NODES = 2000;
	var HISTORY_KEY = "gcli.history";
	var HISTORY_LIMIT = 200;
	var LONG_POLL_TIMEOUT_MS = 25000;

	var log = document.getElementById( "log" );
	var form = document.getElementById( "cmdform" );
	var input = document.getElementById( "cmd" );

	var since = null;
	var refresh = 0;
	var failures = 0;

	var commandHistory = loadHistory();
	var historyIndex = commandHistory.length;
	var draft = "";

	function loadHistory()
	{
		try
		{
			var saved = JSON.parse( sessionStorage.getItem( HISTORY_KEY ) );
			return Array.isArray( saved ) ? saved : [];
		}
		catch ( e )
		{
			return [];
		}
	}

	function saveHistory()
	{
		try
		{
			sessionStorage.setItem( HISTORY_KEY, JSON.stringify( commandHistory ) );
		}
		catch ( e )
		{
		}
	}

	function isNearBottom()
	{
		return log.scrollHeight - log.scrollTop - log.clientHeight < 40;
	}

	function appendLines( html )
	{
		var atBottom = isNearBottom();
		log.insertAdjacentHTML( "beforeend", html );

		while ( log.childNodes.length > MAX_LOG_NODES )
			log.removeChild( log.firstChild );

		if ( atBottom )
			log.scrollTop = log.scrollHeight;
	}

	function appendError( text )
	{
		var escaped = document.createElement( "span" );
		escaped.textContent = text;
		appendLines( "<div style=\"color:red\">" + escaped.innerHTML + "</div>" );
	}

	function clearLog()
	{
		log.innerHTML = "";
	}

	function sleep( ms )
	{
		return new Promise( function( resolve ) { setTimeout( resolve, ms ); } );
	}

	async function pollLoop()
	{
		while ( true )
		{
			var url = since === null
				? "/KoLmafia/messageUpdate?MAFIAHIT"
				: "/KoLmafia/messageUpdate?since=" + since + "&refresh=" + refresh + "&MAFIAHIT";

			try
			{
				var controller = new AbortController();
				var timer = setTimeout( function() { controller.abort(); }, LONG_POLL_TIMEOUT_MS + 5000 );
				var response = await fetch( url, { cache: "no-store", signal: controller.signal } );
				clearTimeout( timer );

				if ( !response.ok )
					throw new Error( "HTTP " + response.status );

				var data = await response.json();
				var reloadSidebar = since !== null && data.refresh !== refresh;
				since = data.head;
				refresh = data.refresh;
				if ( data.skipped > 0 )
					appendError( data.skipped + " lines skipped (too much output between updates)" );
				appendLines( data.events.join( "" ) );
				if ( reloadSidebar && window.top && window.top.charpane )
					window.top.charpane.location.reload();
				failures = 0;
			}
			catch ( e )
			{
				failures++;
				await sleep( Math.min( 1000 * Math.pow( 2, failures ), 15000 ) );
			}
		}
	}

	async function submitCommand( command )
	{
		if ( command == "clear" || command == "cls" || command == "reset" )
		{
			clearLog();
			return;
		}

		try
		{
			var response = await fetch( "/KoLmafia/submitCommand?cmd=" + encodeURIComponent( command ) + "&MAFIAHIT",
				{ cache: "no-store" } );
			if ( !response.ok )
				throw new Error( "HTTP " + response.status );
		}
		catch ( e )
		{
			appendError( "Could not send \"" + command + "\": " + e.message );
		}
	}

	form.addEventListener( "submit", function( event )
	{
		event.preventDefault();

		var command = input.value.trim();
		input.value = "";
		draft = "";

		if ( command == "" )
			return;

		if ( commandHistory[ commandHistory.length - 1 ] != command )
		{
			commandHistory.push( command );
			if ( commandHistory.length > HISTORY_LIMIT )
				commandHistory.shift();
			saveHistory();
		}
		historyIndex = commandHistory.length;

		submitCommand( command );
		input.focus();
	} );

	input.addEventListener( "keydown", function( event )
	{
		if ( event.key == "ArrowUp" && historyIndex > 0 )
		{
			event.preventDefault();
			if ( historyIndex == commandHistory.length )
				draft = input.value;
			historyIndex--;
			input.value = commandHistory[ historyIndex ];
		}
		else if ( event.key == "ArrowDown" && historyIndex < commandHistory.length )
		{
			event.preventDefault();
			historyIndex++;
			input.value = historyIndex == commandHistory.length ? draft : commandHistory[ historyIndex ];
		}
		else if ( event.key == "l" && ( event.ctrlKey || event.metaKey ) )
		{
			event.preventDefault();
			clearLog();
		}
		else if ( event.key == "Escape" )
		{
			event.preventDefault();
			submitCommand( "abort" );
		}
	} );

	document.getElementById( "abort" ).addEventListener( "click", function()
	{
		submitCommand( "abort" );
	} );

	input.focus();
	pollLoop();
</script>

</body>
</html>
